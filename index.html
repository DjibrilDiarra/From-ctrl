<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulaire Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background"></div>

<div class="container">
    <form id="formulaire" class="form-card">
        <h2>Formulaire de contrôle</h2>
        <p>Complétez les informations</p>

        <div class="input-box">
            <input type="text" id="nom" placeholder="Nom complet">
            <small></small>
        </div>

        <div class="input-box">
            <input type="email" id="email" placeholder="Adresse email">
            <small></small>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder="Mot de passe">
            <small></small>
        </div>

        <button type="submit">Envoyer</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
